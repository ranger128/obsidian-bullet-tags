name: Release

# Publishes a release for manifest.json's version whenever main has a version with no release yet.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skip if this version is already released
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # BRAT and the community store look up the release whose tag equals manifest.json's version.
          version=$(node -p 'require("./manifest.json").version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "$version" >/dev/null 2>&1; then
            echo "Release $version already exists"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.exists != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - if: steps.version.outputs.exists != 'true'
        run: npm ci && npm run build
      - name: Create release
        if: steps.version.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          files="main.js manifest.json"
          [ -f styles.css ] && files="$files styles.css"
          gh release create "$VERSION" --target "$GITHUB_SHA" --title "$VERSION" --generate-notes $files
